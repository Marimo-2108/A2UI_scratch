[project]
name = "a2ui-scratch-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "a2ui-agent-sdk",
    "a2ui-core",
    "google-genai>=2.30.0",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
a2ui-core = { path = "../../a2ui/python/a2ui_core", editable = true }
a2ui-agent-sdk = { path = "../../a2ui/python/a2ui_agent", editable = true }
