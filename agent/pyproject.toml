[project]
name = "a2ui-scratch-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.0,<0.4.0",
    "a2ui-agent-sdk",
    "a2ui-core",
    "google-genai>=2.30.0",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
a2ui-core = { git = "https://github.com/a2ui-project/a2ui.git", subdirectory = "python/a2ui_core", rev = "ce03d005c0575ff6708da583d9e7658a34df2d5d" }
a2ui-agent-sdk = { git = "https://github.com/a2ui-project/a2ui.git", subdirectory = "python/a2ui_agent", rev = "ce03d005c0575ff6708da583d9e7658a34df2d5d" }
